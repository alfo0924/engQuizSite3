<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <title>QuizMaster 英文文法測驗</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<header>
    <h1>QuizMaster 英文文法測驗</h1>
    <p class="subtitle">多益 & 托福常見題型｜即時分析與學習建議</p>
</header>
<main>
    <section id="score-section" class="hidden">
        <h2>您的分數：<span id="score"></span> / 25</h2>
        <div id="summary"></div>
    </section>
    <form id="quiz-form">
        <ol id="question-list"></ol>
        <button type="submit" id="submit-btn">送出答案</button>
    </form>
    <section id="analysis-section" class="hidden">
        <h2>題目解析與加強建議</h2>
        <div id="analysis-list"></div>
    </section>
</main>
<footer>
    <p>© 2025 QuizMaster</p>
</footer>
<script src="quiz.js"></script>
</body>
</html>
